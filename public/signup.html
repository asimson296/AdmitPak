<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — AdmitPak</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- SEO -->
    <meta name="description" content="Create a free AdmitPak account to track universities and get deadline reminders.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://admitpak.onrender.com/signup.html">
    <meta name="theme-color" content="#6366f1">

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sign Up to AdmitPak">
    <meta property="og:description" content="Create a free AdmitPak account to track universities and get deadline reminders.">
    <meta property="og:url" content="https://admitpak.onrender.com/signup.html">
    <meta property="og:image" content="https://admitpak.onrender.com/favicon/android-chrome-512x512.png">
    <meta property="og:site_name" content="AdmitPak">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sign Up to AdmitPak">
    <meta name="twitter:description" content="Create a free AdmitPak account to track universities and get deadline reminders.">
    <meta name="twitter:image" content="https://admitpak.onrender.com/favicon/android-chrome-512x512.png">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">
            <a href="/" class="logo">Admit<span>Pak</span></a>
            <nav class="main-nav">
                <a href="/">Home</a>
                <a href="/universities.html">Universities</a>
                <a href="/#find">Find a University</a>
                <a href="/login.html">Log In</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <div class="container">
                <div class="auth-card">
                    <p class="eyebrow">CREATE ACCOUNT</p>
                    <h1>Join AdmitPak</h1>
                    <p class="auth-subtitle">
                        Sign up to track universities and get deadline reminders.
                    </p>

                    <form id="signup-form" class="auth-form" novalidate>
                        <label>
                            <span>Name (optional)</span>
                            <input type="text" name="name" id="name" placeholder="Your name" autocomplete="name">
                        </label>

                        <label>
                            <span>Email</span>
                            <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                        </label>

                        <label>
                            <span>Password</span>
                            <input type="password" name="password" id="password" placeholder="At least 6 characters" autocomplete="new-password" required>
                        </label>

                        <label>
                            <span>Confirm Password</span>
                            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
                        </label>

                        <div id="signup-error" class="auth-error" hidden></div>

                        <button type="submit" class="btn btn-primary auth-submit" id="signup-btn">
                            Create Account
                        </button>
                    </form>

                    <p class="auth-foot">
                        Already have an account? <a href="/login.html">Log in</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div>
                <a href="/" class="logo">Admit<span>Pak</span></a>
                <p>Plan smarter. Apply with confidence.</p>
            </div>
            <p><a href="/privacy.html" style="color:inherit;">Privacy</a> · <a href="/terms.html" style="color:inherit;">Terms</a> · © 2026 AdmitPak</p>
        </div>
    </footer>

    <script src="signup.js"></script>
<script src="header.js"></script>
<script src="feedback.js"></script>
</body>
</html>
