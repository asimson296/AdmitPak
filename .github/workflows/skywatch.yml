name: SkyWatch — University Data Monitor

on:
  # Every Sunday at 2:00 AM Pakistan time (9:00 PM UTC Saturday)
  schedule:
    - cron: '0 21 * * 6'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run SkyWatch monitor
        run: node monitor-runner.js
        continue-on-error: true

      - name: Save change reports
        run: |
          mkdir -p data/change-reports
          mkdir -p data/source-snapshots
          ls -la data/change-reports/ || echo "No reports"

      - name: Commit reports back to repo
        run: |
          git config user.name "SkyWatch Bot"
          git config user.email "skywatch@admitpak.local"
          git add data/change-reports/ data/source-snapshots/ || true
          git diff --staged --quiet || git commit -m "SkyWatch: data check on $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || echo "Nothing to push"

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: change-reports
          path: data/change-reports/
          retention-days: 30
          if-no-files-found: ignore
